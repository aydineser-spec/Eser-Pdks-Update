name: Belge Tarayıcı APK Derle

on:
  push:
    branches:
      - "claude/document-scanner-apk-u6v5oc"
      - "ccr-d75fa510-99mjqh"
    paths:
      - "belge-tarayici/**"
      - ".github/workflows/belge-tarayici-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: belge-tarayici

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Sunucuda hazir kurulu Android SDK kullanilir (setup-android@v3 artik
      # olmayan "tools" paketini istedigi icin derlemeyi bozuyordu)
      - name: Gerekli SDK bileşenlerini yükle
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null || true

      - name: gradlew çalıştırılabilir yap
        run: chmod +x ./gradlew

      - name: Debug APK derle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı yeniden adlandır
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/EserLens.apk
          ls -la ../out

      - name: APK'yı iş çıktısı (artifact) olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: EserLens-APK
          path: out/EserLens.apk
          if-no-files-found: error

      # Surum sayfasi her derlemede SIFIRDAN acilir: baslik, tarih ve aciklama hep
      # guncel gorunur. Eski "Belge Tarayici (son surum)" sayfasi 16 Temmuz tarihli
      # gorunup kafa karistiriyordu; o da silinir.
      - name: Sürüm sayfasını yenile (eskisini sil, yenisini aç)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="$GITHUB_REPOSITORY"
          VER="1.0.${GITHUB_RUN_NUMBER}"
          DATE="$(TZ=Europe/Istanbul date +%d.%m.%Y)"
          gh release delete belge-tarayici-latest --repo "$REPO" --cleanup-tag --yes || true
          gh release delete eser-lens --repo "$REPO" --cleanup-tag --yes || true
          sleep 5
          cat > ../out/notlar.md <<EOF
          Telefona kurulacak dosya: aşağıdaki **EserLens.apk**

          **Nasıl kurulur:** EserLens.apk'ya dokun → indir → aç → "bilinmeyen kaynaklara izin ver" → Yükle.
          Eski Eser Lens'i silmeden üstüne kurulur.

          **Bu sürümde:**
          - Yapay zekâ tamamen kaldırıldı (sayfaları bozuyordu)
          - Uygulama açılınca kamera hemen açılır, belgeyi bulunca kendisi çeker
          - Her sayfanın altında: Kırp / Döndür / Sil (kitap çekiminde İkiye Böl)
          - Altta sadece: Orijinal / Net Belge / Siyah-Beyaz ve + Sayfa / PDF Kaydet / Paylaş
          - Net Belge artık silik ve kurşun kalem yazıyı silmiyor
          - Kırp ve Döndür artık sadece o sayfaya uygulanıyor

          Sürüm $VER · $DATE
          EOF
          gh release create eser-lens ../out/EserLens.apk --repo "$REPO" \
            --target "$GITHUB_SHA" --title "Eser Lens $VER ($DATE)" \
            --notes-file ../out/notlar.md --latest

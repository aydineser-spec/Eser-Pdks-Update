name: Ses Ayar APK

on:
  push:
    paths:
      - "SesAyar/**"
      - ".github/workflows/sesayar-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: SesAyar
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp SesAyar/app/build/outputs/apk/debug/app-debug.apk SesAyar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SesAyar-apk
          path: SesAyar.apk

      # Telefondan kolay indirmek icin: Releases sayfasina da koyar.
      - name: Publish to Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sesayar-latest
          name: Ses Ayar (son surum)
          prerelease: true
          files: SesAyar.apk
